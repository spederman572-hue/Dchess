
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DCHESS</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101713;
      color: #f1f5f2;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 28px 14px;
    }
    main { width: 100%; max-width: 480px; }
    header { margin-bottom: 22px; }
    .brand { color: #8bc59b; font-size: 13px; letter-spacing: 4px; }
    h1 { margin: 7px 0; font-size: 32px; }
    .sub { color: #a8b5ac; font-size: 14px; }
    #status {
      background: #202b23;
      border: 1px solid #344538;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 14px;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      border: 5px solid #28382c;
      border-radius: 5px;
      overflow: hidden;
      aspect-ratio: 1;
      width: 100%;
    }
    .square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      padding: 0;
      aspect-ratio: 1;
      font-size: clamp(24px, 8vw, 43px);
      cursor: pointer;
      user-select: none;
    }
    .light { background: #e7e8d6; }
    .dark { background: #709579; }
    .selected { box-shadow: inset 0 0 0 4px #f4d35e; }
    .legal::after {
      content: "";
      position: absolute;
      width: 23%;
      height: 23%;
      border-radius: 50%;
      background: #263c2c88;
    }
    .legal.has-piece::after {
      width: 85%;
      height: 85%;
      background: transparent;
      border: 4px solid #263c2c88;
    }
    .piece { position: relative; z-index: 1; }
    .white-piece {
      color: #fffdf1;
      text-shadow: 0 1px 2px #333, 0 0 2px #333;
    }
    .black-piece {
      color: #242b26;
      text-shadow: 0 1px 1px #fff8;
    }
    .coords {
      position: absolute;
      left: 3px;
      top: 2px;
      font-size: 9px;
      opacity: .75;
    }
    .controls { display: flex; gap: 10px; margin-top: 14px; }
    button.action {
      flex: 1;
      border: 1px solid #435447;
      background: #202b23;
      color: #fff;
      border-radius: 9px;
      padding: 12px 8px;
      font-size: 14px;
      cursor: pointer;
    }
    button.action:active { background: #344538; }
    #moves {
      margin-top: 18px;
      background: #18211b;
      border-radius: 10px;
      padding: 14px;
      min-height: 60px;
      color: #b9c7bc;
      font-size: 14px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }
    .label { color: #8bc59b; font-size: 11px; letter-spacing: 2px; }
    footer { color: #7f9084; font-size: 12px; margin-top: 18px; }
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand">DCHESS / 001</div>
    <h1>Play with precision.</h1>
    <div class="sub">Legal move system · Step 1</div>
  </header>

  <div id="status" role="status">Loading chess rules...</div>
  <div id="board" aria-label="Chessboard"></div>

  <div class="controls">
    <button class="action" id="undo">↶ Undo move</button>
    <button class="action" id="reset">⟳ New game</button>
  </div>

  <div id="moves">
    <div class="label">MOVE HISTORY</div>
    <div id="history">No moves yet.</div>
  </div>
  <footer> DCHESS · Built for the love of chess.</footer>
</main>

<script>
(() => {
  const boardEl = document.getElementById("board");
  const statusEl = document.getElementById("status");
  const historyEl = document.getElementById("history");
  const files = "abcdefgh";
  const symbols = {
    w: { k:"♔", q:"♕", r:"♖", b:"♗", n:"♘", p:"♙" },
    b: { k:"♚", q:"♛", r:"♜", b:"♝", n:"♞", p:"♟" }
  };

  if (typeof Chess === "undefined") {
    statusEl.textContent = "Chess rules failed to load. Check your internet connection and reload.";
    return;
  }

  const game = new Chess();
  let selected = null;
  let targets = [];

  function render() {
    boardEl.innerHTML = "";
    const position = game.board();

    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const square = files[c] + (8 - r);
        const piece = position[r][c];
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "square " + ((r + c) % 2 === 0 ? "light" : "dark");
        btn.setAttribute("aria-label", square + (piece ? " " + piece.color + " " + piece.type : ""));
        if (selected === square) btn.classList.add("selected");
        if (targets.includes(square)) {
          btn.classList.add("legal");
          if (piece) btn.classList.add("has-piece");
        }

        if (c === 0) {
          const rank = document.createElement("span");
          rank.className = "coords";
          rank.textContent = 8 - r;
          btn.appendChild(rank);
        }
        if (r === 7) {
          const file = document.createElement("span");
          file.className = "coords";
          file.style.left = "auto";
          file.style.right = "3px";
          file.style.top = "auto";
          file.style.bottom = "2px";
          file.textContent = files[c];
          btn.appendChild(file);
        }
        if (piece) {
          const span = document.createElement("span");
          span.className = "piece " + (piece.color === "w" ? "white-piece" : "black-piece");
          span.textContent = symbols[piece.color][piece.type];
          btn.appendChild(span);
        }
        btn.addEventListener("click", () => clickSquare(square));
        boardEl.appendChild(btn);
      }
    }
    updateStatus();
    const history = game.history();
    historyEl.textContent = history.length
      ? history.map((move, i) => (i % 2 === 0 ? (Math.floor(i / 2) + 1) + ". " : "") + move).join(" ")
      : "No moves yet.";
  }

  function updateStatus() {
    if (game.isCheckmate()) {
      statusEl.textContent = "Checkmate! " + (game.turn() === "w" ? "Black" : "White") + " wins.";
    } else if (game.isDraw()) {
      statusEl.textContent = "Draw — the game is over.";
    } else if (game.isCheck()) {
      statusEl.textContent = (game.turn() === "w" ? "White" : "Black") + " is in check!";
    } else {
      statusEl.textContent = (game.turn() === "w" ? "White" : "Black") + " to move.";
    }
  }

  function clickSquare(square) {
    if (game.isGameOver()) return;

    if (selected && targets.includes(square)) {
      const result = game.move({ from: selected, to: square, promotion: "q" });
      if (result) {
        selected = null;
        targets = [];
        render();
        return;
      }
    }

    const piece = game.get(square);
    if (piece && piece.color === game.turn()) {
      selected = square;
      targets = game.moves({ square, verbose: true }).map(m => m.to);
    } else {
      selected = null;
      targets = [];
    }
    render();
  }

  document.getElementById("undo").addEventListener("click", () => {
    game.undo();
    selected = null;
    targets = [];
    render();
  });

  document.getElementById("reset").addEventListener("click", () => {
    game.reset();
    selected = null;
    targets = [];
    render();
  });

  render();
})();
</script>
</body>
</html>
